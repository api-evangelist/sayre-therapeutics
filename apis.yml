name: Sayre Therapeutics
description: 'Sayre Therapeutics is a healthcare company founded in 2015 that brings innovative
  treatments for rare, orphan, and life-threatening diseases to India and the broader SAARC
  region. It works across clinical research, regulatory strategy, and commercialization and
  market access, partnering with global licensors to bring US-, EU-, and Japan-approved drugs,
  drug-delivery devices, and diagnostics to South Asian markets under local regulatory standards.
  Its portfolio spans special-access and commercially approved products, diagnostics, biosimilars,
  and niche generics. Surfaced as a portfolio company of Accel and added to the API Evangelist
  network. The company publishes no public developer portal, API, or technical documentation.'
